services:
  - type: web
    name: triplees-free
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: python -m services.api.run_render
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: VERICARB_DATA_DIR
        value: /tmp/triplees-data
      - key: VERICARB_TOKEN_SECRET
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_ENABLED
        value: "true"
      - key: NEAR_REPORT_COMMITMENTS_ENABLED
        value: "false"
      - key: X1_TESTNET_RPC_URL
        value: https://maculatus-rpc.x1eco.com
      - key: X1_TESTNET_CHAIN_ID
        value: "10778"
      - key: X1_TESTNET_EXPLORER_URL
        value: https://maculatus-scan.x1eco.com
      - key: X1_TESTNET_NATIVE_CURRENCY
        value: X1T
      - key: AI_PROVIDER
        value: nebius_token_factory
      - key: NEBIUS_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: AI_DAILY_TOKEN_LIMIT
        value: "100000"
